name: Daily MSE Data Update

on:
  schedule:
    # 12:00 UTC = 20:00 Ulaanbaatar (UTC+8, no DST) — well after MSE's
    # trading session closes, primary daily run.
    - cron: "0 12 * * *"
    # 00:00 UTC = 08:00 Ulaanbaatar next morning — safety-net catch-up in
    # case the evening run missed data that MSE published late, or in case
    # GitHub's scheduler delayed/skipped the evening run entirely (this does
    # happen on shared runners). Safe to run twice: the updater dedupes by
    # (ticker, date), so a second run on already-current data just no-ops.
    - cron: "0 0 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write # needed so the workflow can commit the updated CSV back

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scraper
        run: python scripts/daily_update.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/mse_daily_prices.csv \
            data/mse_financials.csv \
            data/mse_dividends.csv \
            data/mse_daily_orderbook.csv \
            data/mse_orderbook_checked_dates.csv

          echo "=== STATUS AFTER GIT ADD ==="
          git status --short

          if git diff --staged --quiet; then
            echo "No new data today, nothing to commit."
          else
            git commit -m "Daily MSE data update: $(date -u +'%Y-%m-%d')"

            echo "=== STATUS AFTER COMMIT ==="
            git status --short

            echo "=== UNSTAGED FILES ==="
            git diff --name-only

            git pull --rebase origin main
            git push origin main
          fi
