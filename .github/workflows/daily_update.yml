name: Daily MSE Data Update

on:
  schedule:
    # 09:00 UTC = 17:00 Ulaanbaatar time (UTC+8), a few hours after MSE's
    # trading session closes. Adjust if MSE's hours or your timezone differ.
    - cron: '0 9 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated CSV back

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scraper
        run: python scripts/daily_update.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mse_daily_prices.csv
          if git diff --staged --quiet; then
            echo "No new data today, nothing to commit."
          else
            git commit -m "Daily MSE data update: $(date -u +'%Y-%m-%d')"
            git push
          fi
