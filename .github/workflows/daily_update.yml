name: Daily MSE Data Update

on:
  schedule:
    # 12:00 UTC = 20:00 Ulaanbaatar (UTC+8, no DST) — well after MSE's
    # trading session closes, primary daily run.
    - cron: "0 12 * * *"
    # 00:00 UTC = 08:00 Ulaanbaatar next morning — safety-net catch-up in
    # case the evening run missed data that MSE published late, or in case
    # GitHub's scheduler delayed/skipped the evening run entirely (this does
    # happen on shared runners). Safe to run twice: the updater dedupes by
    # (ticker, date), so a second run on already-current data just no-ops.
    - cron: "0 0 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write # needed so the workflow can commit the updated CSV back

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scraper
        run: python scripts/daily_update.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mse_daily_prices.csv data/mse_financials.csv data/mse_dividends.csv
          if git diff --staged --quiet; then
            echo "No new data today, nothing to commit."
          else
            git commit -m "Daily MSE data update: $(date -u +'%Y-%m-%d')"
            # Pull any commits that landed after this job's checkout (e.g. a
            # manual push happening around the same time) before pushing,
            # so a race condition doesn't fail the whole job.
            git pull --rebase origin main
            git push
          fi
